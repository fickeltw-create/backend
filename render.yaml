services:
  - type: web
    name: modura-backend
    env: node
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        sync: false
      - key: AUTH_MFA_ENCRYPTION_KEY
        sync: false
      - key: MEDUSA_ADMIN_ONBOARDING_TYPE
        value: default
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: MEDUSA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: STORE_CORS
        value: "http://localhost:8000,https://medusafront-oyq7.onrender.com,https://modura.be,https://www.modura.be"
      - key: ADMIN_CORS
        value: "http://localhost:9000,https://backend-ltnt.onrender.com"
      - key: AUTH_CORS
        value: "http://localhost:8000,https://medusafront-oyq7.onrender.com,https://modura.be,https://www.modura.be"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true