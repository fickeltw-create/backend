# fly.toml app configuration file generated for modura-ecommerce on 2026-07-19T01:43:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'modura-ecommerce'
primary_region = 'ams'

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["paketobuildpacks/nodejs:2.4.0"]
[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024